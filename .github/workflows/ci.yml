name: release-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://app_test:test_password@localhost:5432/app_test
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,testserver
      JWT_SECRET_KEY: ci_only_secret_with_more_than_32_characters
      JWT_COOKIE_SECURE: "false"
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ollama
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_MODEL: test-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: python -m pip check
      - run: python -m compileall -q app alembic tests
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    env:
      # Build-time rewrite target only; no backend request is made during build.
      BACKEND_URL: http://api.internal:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build -- --webpack
