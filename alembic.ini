[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# alembic/env.py reads the validated DATABASE_URL from app.settings.  This
# non-secret placeholder is retained only because Alembic expects the option.
sqlalchemy.url = driver://

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
